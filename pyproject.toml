[project]
name = "banking-customer-support-ai"
version = "0.1.0"
description = "Multi-agent banking customer support assistant (LangGraph + OpenAI + PostgreSQL + Streamlit)"
readme = "README.md"
authors = [
    { name = "vigneshwaran", email = "vigneshwaran01.k@matrimony.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "openai>=3.19.2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[project.scripts]
banking-customer-support-ai = "banking_customer_support_ai:main"
banking-eval = "banking_customer_support_ai.evaluation.runner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
